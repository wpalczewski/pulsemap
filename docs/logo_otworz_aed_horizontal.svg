<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800&amp;family=Inter+Tight:wght@700;800&amp;display=swap');
            .brand-name { font-family: 'Inter Tight', 'Inter', -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: #14201B; letter-spacing: -0.03em; }
            .brand-aed { fill: #00875A; }
            .brand-tagline { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #4B6358; letter-spacing: 0.08em; text-transform: uppercase; }
        </style>
    </defs>

    <!-- Sygnet -->
    <g transform="translate(10, 10)">
        <rect width="100" height="100" rx="24" fill="#00875A" />
        <path d="M33 46 V32.5 C33 23.3 40.5 15.8 50 15.8 C59.5 15.8 67 23.3 68 32.5" 
              fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="22" y="45" width="56" height="37.5" rx="9" fill="#FFFFFF" />
        <path d="M28 65 H41 L46 54 L53 74 L59 59 L63 65 H72" 
              fill="none" stroke="#00875A" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Logotyp i Hasło -->
    <text x="135" y="65" class="brand-name">Otwórz <tspan class="brand-aed">AED</tspan></text>
    <text x="136" y="94" class="brand-tagline">Twoja minuta. Czyjeś życie.</text>
</svg>
